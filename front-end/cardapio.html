<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Sempre Doce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo.png" width="42" height="42" class="rounded-circle" alt="">
        <span>Sempre Doce</span>
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto gap-3">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#sobre">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="cardapio.html">Cardápio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contato">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <section class="header">
    <div class="container text-center">
      <h1>Nosso Cardápio</h1>
      <p>
        Escolha o doce perfeito para o seu momento 🍰
      </p>
    </div>
  </section>

  <!-- PRODUTOS -->
  <section class="produtos">
    <div class="container">
      <h2 class="section-title text-center">
        Nossos Produtos
      </h2>
      <div class="row" id="cardapio"></div>
    </div>
  </section>

  <!-- CONTATO -->
  <section id="contato">
    <div class="container">
      <h2 class="section-title text-center">
        Contato
      </h2>
      <div class="row mt-5 g-4">
        <div class="col-md-4">
          <div class="contact-card text-center">
            <i class="bi bi-telephone-fill"></i>
            <h5>Telefone</h5>
            <p>(11) 98765-4321</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="contact-card text-center">
            <i class="bi bi-envelope-fill"></i>
            <h5>Email</h5>
            <p>contato@sempredoce.com</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="contact-card text-center">
            <i class="bi bi-geo-alt-fill"></i>
            <h5>Endereço</h5>
            <p>São Paulo - SP</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container text-center">
      <p class="mb-0">
        © 2026 Confeitaria Sempre Doce
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
